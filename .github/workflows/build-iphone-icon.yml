name: Build iPhone icon
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to iPhone PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='discipline4-icon.svg',write_to='apple-touch-icon.png',output_width=180,output_height=180)
          cairosvg.svg2png(url='discipline4-icon.svg',write_to='icon-512.png',output_width=512,output_height=512)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate iPhone PNG app icons"
            git push
          fi
